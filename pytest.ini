[pytest]
testpaths = tools/tests
pythonpath = .
addopts = --strict-markers
# Keep tmp_path dirs of failing tests only: the mod-toggle tests leave ~1.9 GB per run, pytest keeps the last three
# runs, and that filled the user's /tmp quota (tmpfs) on 2026-11-26 and broke a verdict's synthetic gate.
tmp_path_retention_policy = failed
markers =
    needs_dump: needs the user's ISO in game_files/ and tools/bin/pspdecrypt; skipped otherwise
