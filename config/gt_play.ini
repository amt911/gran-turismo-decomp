; gt_play settings (lcs-recomp's format; copied next to build/gt_play by CMake).
; PSPRECOMP_CONFIG=<path> uses another file.

[Display]
; PSP, Scale, Custom (Width, Height) or Desktop.
ResolutionMode=Scale
Scale=2
Fullscreen=false
UpscaleFilter=Bilinear
IntegerScale=false
ShowFPS=true
VSync=true

[Rendering]
Backend=Vulkan
; NativeGE=true draws the GE on the GPU (lcs-recomp's Vulkan backend with GT's patches 0019-0021): full
; speed and a sharp picture. Still being verified against the software rasterizer (tools/gpu_gate.sh):
; car reflections in the dealer and a few screen transitions differ.
; NativeGE=false keeps the software rasterizer (always 480x272, slower).
; The terminal says which one is drawing: "[window] ... presenter=vulkan" is the GPU.
NativeGE=false
; Internal resolution of the GPU picture: Window = the smallest whole multiple of 480x272 that covers
; the window, followed live when you resize it or go fullscreen (1080p: x4, 1440p: x6); Desktop = the
; same for the whole screen, fixed at start; Scale = InternalScale x 480x272; PSP = 480x272.
InternalResolutionMode=Window
; Upper limit for Window/Desktop. Lower it on weak GPUs (phones, Raspberry Pi): 2 = 960x544.
MaxInternalScale=8
; GPU budget in milliseconds per frame (0 = off). With InternalResolutionMode=Window the scale steps down while
; the GPU needs more than this per frame (an integrated GPU on battery) and back up when the next scale fits;
; "[vulkan] GPU ... ms per frame ... internal scale xN -> xM" in the terminal says when it changes.
GpuBudgetMs=10
InternalScale=4
; GT shifts its 3D picture by half a pixel every other frame (anti-aliasing the PSP's slow screen blended); on a
; modern screen it is a side-to-side wobble, so the GPU path removes it. true keeps the original jitter.
KeepTemporalJitter=false

[Widescreen]
; lcs-recomp's widescreen support patches LCS code: never on GT.
Enabled=false

[Controls]
; lcs-recomp's action names (written for GTA), mapped here to GT's PSP buttons:
;   Sprint = Cross (accelerate / OK), Jump = Square (brake), Attack = Circle (back),
;   EnterVehicle = Triangle, MoveLeft/MoveRight = analog stick (steer), Up/Down/WeaponPrevious/
;   WeaponNext = d-pad, CenterCamera = L, Aim = R, Pause = START, Camera = SELECT.
; Several keys: separate with commas. None clears a binding.
MoveForward=None
MoveBack=None
MoveLeft=A
MoveRight=D
Walk=None
Sprint=W,Enter,Space
Jump=S,LeftShift
EnterVehicle=F
Attack=Backspace
Aim=E
CenterCamera=Q
WeaponPrevious=Left
WeaponNext=Right
Up=Up
Down=Down
Pause=Escape
Camera=V
Handbrake=None
; Controller (Xbox names; on a PlayStation pad A is Cross, B Circle, X Square, Y Triangle).
PadA=Sprint
PadB=Attack
PadX=Jump
PadY=EnterVehicle
PadLeftShoulder=CenterCamera
PadRightShoulder=Aim
PadLeftTrigger=Jump
PadRightTrigger=Sprint
PadStart=Pause
PadBack=Camera
PadDpadUp=Up
PadDpadDown=Down
PadDpadLeft=WeaponPrevious
PadDpadRight=WeaponNext
PadLeftStickClick=None
PadRightStickClick=None
LeftStick=Move
RightStick=None

[Timing]
FrameRate=60
