; gt_play settings (lcs-recomp's format; copied next to build/gt_play by CMake).
; PSPRECOMP_CONFIG=<path> uses another file.

[Display]
; PSP, Scale, Custom (Width, Height) or Desktop.
ResolutionMode=Scale
Scale=2
Fullscreen=false
UpscaleFilter=Bilinear
IntegerScale=false
ShowFPS=true
VSync=true

[Rendering]
Backend=Vulkan
; NativeGE=true draws the GE on the GPU (lcs-recomp's Vulkan backend with GT's patches 0019-0021):
; full speed and a sharper picture at InternalScale 2-4. Still being verified against the software
; rasterizer (tools/gpu_gate.sh): car reflections in the dealer and a few screen transitions differ.
; NativeGE=false keeps the software rasterizer (always 480x272, slower).
NativeGE=false
InternalResolutionMode=Scale
InternalScale=2

[Widescreen]
; lcs-recomp's widescreen support patches LCS code: never on GT.
Enabled=false

[Controls]
; lcs-recomp's action names (written for GTA), mapped here to GT's PSP buttons:
;   Sprint = Cross (accelerate / OK), Jump = Square (brake), Attack = Circle (back),
;   EnterVehicle = Triangle, MoveLeft/MoveRight = analog stick (steer), Up/Down/WeaponPrevious/
;   WeaponNext = d-pad, CenterCamera = L, Aim = R, Pause = START, Camera = SELECT.
; Several keys: separate with commas. None clears a binding.
MoveForward=None
MoveBack=None
MoveLeft=A
MoveRight=D
Walk=None
Sprint=W,Enter,Space
Jump=S,LeftShift
EnterVehicle=F
Attack=Backspace
Aim=E
CenterCamera=Q
WeaponPrevious=Left
WeaponNext=Right
Up=Up
Down=Down
Pause=Escape
Camera=V
Handbrake=None
; Controller (Xbox names; on a PlayStation pad A is Cross, B Circle, X Square, Y Triangle).
PadA=Sprint
PadB=Attack
PadX=Jump
PadY=EnterVehicle
PadLeftShoulder=CenterCamera
PadRightShoulder=Aim
PadLeftTrigger=Jump
PadRightTrigger=Sprint
PadStart=Pause
PadBack=Camera
PadDpadUp=Up
PadDpadDown=Down
PadDpadLeft=WeaponPrevious
PadDpadRight=WeaponNext
PadLeftStickClick=None
PadRightStickClick=None
LeftStick=Move
RightStick=None

[Timing]
FrameRate=60
